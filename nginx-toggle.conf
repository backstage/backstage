upstream shadcn_app {
    server host.docker.internal:3000;
}

upstream mui_app {
    server host.docker.internal:3001;
}

upstream backend_api {
    server host.docker.internal:7007;
}

map $cookie_design_system $app_upstream {
    mui     mui_app;
    default shadcn_app;
}

server {
    listen 8080;

    # Design system toggle page
    location = /toggle {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blitzy Sandbox - Design System Toggle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #111; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .sub { color: #888; margin-bottom: 2rem; font-size: 0.9rem; }
    .cards { display: flex; gap: 2rem; }
    .card { padding: 2rem 3rem; border-radius: 1rem; color: #fff; text-align: center; transition: transform 0.15s, box-shadow 0.15s; cursor: pointer; border: none; font-family: inherit; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .card h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .card p { color: rgba(255,255,255,0.7); margin-bottom: 0; font-size: 0.8rem; }
    .shadcn { background: #1a1a1a; border: 1px solid #333; }
    .mui { background: #1565c0; border: 1px solid #1976d2; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.5rem; vertical-align: middle; }
    .tag { font-size: 0.7rem; background: rgba(255,255,255,0.15); padding: 0.2rem 0.6rem; border-radius: 1rem; margin-top: 0.75rem; display: inline-block; }
  </style>
</head>
<body>
  <h1>Blitzy Sandbox</h1>
  <p class="sub">Choose a design system to explore</p>
  <div class="cards">
    <button class="card shadcn" onclick="pick(&#39;shadcn&#39;)">
      <h2><span class="dot" style="background:#22c55e"></span>shadcn/ui</h2>
      <p>Tailwind CSS + Radix UI<br>New frontend system</p>
      <span class="tag">Active</span>
    </button>
    <button class="card mui" onclick="pick(&#39;mui&#39;)">
      <h2><span class="dot" style="background:#ff9800"></span>Material UI</h2>
      <p>MUI v4/v5 + JSS<br>Legacy frontend system</p>
      <span class="tag">Legacy</span>
    </button>
  </div>
  <script>
    function pick(ds) {
      document.cookie = "design_system=" + ds + ";path=/;max-age=31536000";
      window.location.href = "/";
    }
  </script>
</body>
</html>';
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # All other routes - proxy based on cookie
    location / {
        # First-time visitors with no cookie go to toggle page
        if ($cookie_design_system = "") {
            return 302 /toggle;
        }

        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
