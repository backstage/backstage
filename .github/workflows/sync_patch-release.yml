name: Sync Patch Release
on:
  pull_request:
    types: [labeled, unlabeled, closed]
  workflow_dispatch: {}

concurrency:
  group: sync-patch-release
  cancel-in-progress: true

jobs:
  sync-patch-release:
    name: Sync Patch Release
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'backstage/backstage' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
          github.event.label.name == 'patch-release'
        )
      )
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 20000
          fetch-tags: true
          token: ${{ secrets.GH_SERVICE_ACCOUNT_TOKEN }}

      - name: Use Node.js 22.x
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/ # Needed for auth

      - name: Configure Git
        run: |
          git config --global user.email noreply@backstage.io
          git config --global user.name 'Github patch release workflow'

      - name: Collect patches from labeled PRs
        id: collect
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GH_SERVICE_ACCOUNT_TOKEN }}
          script: |
            const { data: result } = await github.rest.search.issuesAndPullRequests({
              q: `is:pr is:merged label:patch-release repo:${context.repo.owner}/${context.repo.repo}`,
              per_page: 100,
            });

            const patches = result.items
              .map(item => ({
                number: item.number,
                title: item.title,
                mergedAt: item.pull_request?.merged_at,
              }))
              .sort((a, b) => {
                if (!a.mergedAt || !b.mergedAt) {
                  return a.number - b.number;
                }
                return new Date(a.mergedAt) - new Date(b.mergedAt);
              });

            if (patches.length === 0) {
              console.log('No merged PRs with patch-release label found');
              core.setOutput('has_patches', 'false');
              return;
            }

            console.log(`Found ${patches.length} patch(es):`);
            for (const p of patches) {
              console.log(`  #${p.number}: ${p.title}`);
            }

            core.setOutput('has_patches', 'true');
            core.setOutput('patches', JSON.stringify(patches));
            core.setOutput('pr_numbers', patches.map(p => p.number).join(' '));

      - name: Find existing PR
        id: find-pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GH_SERVICE_ACCOUNT_TOKEN }}
          script: |
            const branchName = 'patch-release';
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              state: 'open',
            });

            if (pulls.length > 0) {
              console.log(`Found existing PR: #${pulls[0].number}`);
              core.setOutput('pr_number', pulls[0].number.toString());
              core.setOutput('pr_exists', 'true');
            } else {
              console.log('No existing PR found');
              core.setOutput('pr_exists', 'false');
            }

      - name: Close PR and delete branch if no patches
        if: steps.collect.outputs.has_patches == 'false'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GH_SERVICE_ACCOUNT_TOKEN }}
          script: |
            const branchName = 'patch-release';

            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              state: 'open',
            });

            if (pulls.length > 0) {
              console.log(`Closing PR #${pulls[0].number}`);
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pulls[0].number,
                state: 'closed',
              });
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`,
              });
              console.log(`Deleted branch ${branchName}`);
            } catch (error) {
              if (error.status === 422) {
                console.log(`Branch ${branchName} does not exist, skipping deletion`);
              } else {
                throw error;
              }
            }

      - name: Install Dependencies
        if: steps.collect.outputs.has_patches == 'true'
        run: yarn --immutable

      - name: Run patch release script
        if: steps.collect.outputs.has_patches == 'true'
        id: run-script
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SERVICE_ACCOUNT_TOKEN }}
          HUSKY: '0'
          PATCH_RELEASE_BRANCH: patch-release
        run: |
          node scripts/patch-release-for-pr.js ${{ steps.collect.outputs.pr_numbers }}
          git push origin patch-release --force

      - name: Create or update PR
        if: steps.collect.outputs.has_patches == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_EXISTS: ${{ steps.find-pr.outputs.pr_exists }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
          PATCHES: ${{ steps.collect.outputs.patches }}
          PATCH_BRANCH: ${{ steps.run-script.outputs.patch_branch }}
        with:
          github-token: ${{ secrets.GH_SERVICE_ACCOUNT_TOKEN }}
          script: |
            const branchName = 'patch-release';
            const patches = JSON.parse(process.env.PATCHES);

            const descriptionList = patches.map(p => `- ${p.title}`).join('\n');
            const prNumbers = patches.map(p => p.number).join(',');
            const body = `This patch release fixes the following issues:\n\n${descriptionList}\n\n<!-- patch-prs:${prNumbers} -->`;
            const title = 'Patch Release';

            const prExists = process.env.PR_EXISTS === 'true';
            const prNumber = process.env.PR_NUMBER;
            const patchBranch = process.env.PATCH_BRANCH;

            if (prExists && prNumber) {
              console.log(`Updating PR #${prNumber}`);
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: parseInt(prNumber, 10),
                title,
                body,
              });
            } else {
              if (!patchBranch) {
                throw new Error('Patch branch not provided from script');
              }

              console.log(`Creating new PR with base branch: ${patchBranch}`);

              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                head: branchName,
                base: patchBranch,
              });
              console.log(`Created PR #${pr.number}`);
            }

  cleanup-labels:
    name: Cleanup Patch Release Labels
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'backstage/backstage' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'patch-release'
    permissions:
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Remove patch-release labels from included PRs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GH_SERVICE_ACCOUNT_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const match = body.match(/<!-- patch-prs:([\d,]+) -->/);
            const prNumbers = match ? match[1].split(',').map(n => parseInt(n, 10)) : [];

            if (prNumbers.length === 0) {
              console.log('No PR references found in patch release PR body');
              return;
            }

            console.log(`Found ${prNumbers.length} PR(s) to clean up: ${prNumbers.join(', ')}`);

            for (const prNumber of prNumbers) {
              console.log(`Removing patch-release label from PR #${prNumber}`);
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: 'patch-release',
                });
              } catch (error) {
                console.log(`Failed to remove label from #${prNumber}: ${error.message}`);
              }
            }
