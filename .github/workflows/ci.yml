name: CI
on:
  # NOTE: If you change these you must update ci-noop.yml as well
  pull_request:
    paths:
      - '**'
      - '!microsite/**'
      - 'microsite/data/**'
      - '!beps/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  # This step only runs yarn install to make sure that an exact match is available
  # in the cache. The two following verify and tests jobs then always install from cache.
  install:
    runs-on: ubuntu-latest

    strategy: &strategy
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192

    name: Install ${{ matrix.node-version }}
    steps:
      - &harden-runner
        name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # Store the PR number for the Sync Pull Requests workflow
      - name: Save PR context
        if: matrix.node-version == '22.x'
        run: |
          mkdir -p ./context
          echo "${{ github.event.pull_request.number }}" > ./context/pr-number

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node-version == '22.x'
        with:
          name: pr-context
          path: context/

      - &checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - &setup-node
        name: use node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/ # Needed for auth

      - &yarn-install
        name: yarn install
        uses: backstage/actions/yarn-install@2cd6978b476cbdc39fec48346f8b6ca13199dd6a # v0.7.8
        with:
          cache-prefix: ${{ runner.os }}-v${{ matrix.node-version }}

  # The verify jobs runs all the verification that doesn't require a
  # diff towards master, since it takes some time to fetch that.
  verify:
    runs-on: ubuntu-latest

    needs: install

    strategy: *strategy

    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192

    name: Verify ${{ matrix.node-version }}
    steps:
      - *harden-runner

      - *checkout

      - *setup-node

      - *yarn-install

      - parallel:
          - name: type checking and declarations
            run: yarn tsc:full

          # We need to generate the API references as well, so that we can verify the doc links
          - name: check api reports and generate API reference
            run: yarn build:api-reports:only --ci --docs

          # Build docs-ui to ensure documentation site builds successfully
          - name: install docs-ui dependencies
            working-directory: docs-ui
            run: yarn install

      - parallel:
          - name: verify yarn dependency duplicates
            run: node scripts/verify-lockfile-duplicates.js

          - name: verify changesets
            run: node scripts/verify-changesets.js

          - name: verify local dependency ranges
            run: node scripts/verify-local-dependencies.js

          - name: verify peer dependency ranges
            run: yarn lint:peer-deps

          - name: check for missing repo fixes
            run: yarn fix --check

          - name: validate config
            run: yarn backstage-cli config:check --lax

          - name: verify api reference
            run: node scripts/verify-api-reference.js

          - name: verify catalog-info.yaml consistency
            run: yarn backstage-repo-tools generate-catalog-info --ci

          - name: lint openapi yaml files
            run: yarn backstage-repo-tools repo schema openapi lint

          - name: verify openapi yaml file matches generated ts file
            run: yarn backstage-repo-tools repo schema openapi verify

          - name: verify doc links
            run: node scripts/verify-links.js

          - name: verify plugin directory
            run: node scripts/verify-plugin-directory.js

          - name: build all packages
            run: yarn backstage-cli repo build --all

          - name: build docs-ui
            working-directory: docs-ui
            run: yarn build

          - name: verify type dependencies
            run: yarn lint:type-deps

      - &ensure-clean-working-directory
        name: ensure clean working directory
        run: |
          if [ -z "$(git ls-files --exclude-standard --others --modified)" ]; then
            exit 0
          fi

          echo ""
          echo "Working directory has been modified:"
          echo ""
          git status --short
          echo ""
          exit 1

  typos:
    runs-on: ubuntu-latest

    name: Spell Check
    steps:
      - *harden-runner

      - *checkout

      - name: check for typos
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
        with:
          config: typos.toml

  # The test job runs all tests as well as any verification step that
  # requires a diff towards master.
  test:
    runs-on: ubuntu-latest

    needs: install

    strategy: *strategy

    name: Test ${{ matrix.node-version }}
    services:
      postgres18:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432/tcp
      postgres14:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432/tcp
      mysql8:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306/tcp
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379/tcp

    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192 --experimental-vm-modules
      INTEGRATION_TEST_GITHUB_TOKEN: ${{ secrets.INTEGRATION_TEST_GITHUB_TOKEN }}
      INTEGRATION_TEST_GITLAB_TOKEN: ${{ secrets.INTEGRATION_TEST_GITLAB_TOKEN }}
      INTEGRATION_TEST_BITBUCKET_TOKEN: ${{ secrets.INTEGRATION_TEST_BITBUCKET_TOKEN }}
      INTEGRATION_TEST_AZURE_TOKEN: ${{ secrets.INTEGRATION_TEST_AZURE_TOKEN }}

    steps:
      - *checkout

      - name: fetch master branch
        run: git fetch origin master

        # Need to fetch the base branch to be able to verify the release
      - name: fetch base branch
        env:
          PR_BRANCH_NAME: ${{ github.event.pull_request.base.ref }}
        if: github.event.pull_request.base.ref != 'master'
        run: git fetch origin "$PR_BRANCH_NAME"

      - *setup-node

      - *yarn-install

      # This check is done here since it needs git history
      - name: verify release
        run: node scripts/verify-release.js

      # Use the lower-level cache actions for the success cache, so that we can store the cache even on failed builds
      - name: restore backstage-cli cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/backstage-cli
          key: ${{ runner.os }}-v${{ matrix.node-version }}-backstage-cli-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-v${{ matrix.node-version }}-backstage-cli-

      - parallel:
          - name: prettier
            run: yarn prettier:check --cache --cache-location .cache/backstage-cli/.prettier-cache

          - name: lint changed packages
            run: yarn backstage-cli repo lint --since origin/master --success-cache --success-cache-dir .cache/backstage-cli

          - name: test changed packages
            id: test
            run: yarn backstage-cli repo test --since origin/master --success-cache --success-cache-dir .cache/backstage-cli --maxWorkers=3 --workerIdleMemoryLimit=1300M
            env:
              BACKSTAGE_TEST_DISABLE_DOCKER: 1
              BACKSTAGE_TEST_DATABASE_POSTGRES18_CONNECTION_STRING: postgresql://postgres:postgres@localhost:${{ job.services.postgres18.ports[5432] }}
              BACKSTAGE_TEST_DATABASE_POSTGRES14_CONNECTION_STRING: postgresql://postgres:postgres@localhost:${{ job.services.postgres14.ports[5432] }}
              BACKSTAGE_TEST_DATABASE_MYSQL8_CONNECTION_STRING: mysql://root:root@localhost:${{ job.services.mysql8.ports[3306] }}/ignored
              BACKSTAGE_TEST_CACHE_REDIS7_CONNECTION_STRING: redis://localhost:${{ job.services.redis.ports[6379] }}

      # Save successful test results even if other tests failed
      - name: save backstage-cli cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.test.outcome != 'skipped' && !cancelled()
        with:
          path: .cache/backstage-cli
          key: ${{ runner.os }}-v${{ matrix.node-version }}-backstage-cli-${{ github.run_id }}

      - *ensure-clean-working-directory
