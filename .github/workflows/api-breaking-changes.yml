name: API Breaking Changes (Trigger)
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - '**/openapi.yaml'

jobs:
  get-backstage-changes:
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    name: Build PR image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          # Fetch the commit that's merged into the base rather than the target ref
          # This will let us diff only the contents of the PR, without fetching more history
          ref: 'refs/pull/${{ github.event.pull_request.number }}/merge'

      - name: fetch base
        run: git fetch --depth 1 origin "$GITHUB_BASE_REF"

      - name: setup-node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org/

      - name: yarn install
        uses: backstage/actions/yarn-install@v0.7.13
        with:
          cache-prefix: linux-v24

      - name: install oasdiff
        env:
          OASDIFF_VERSION: '1.18.1'
        run: curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/v${OASDIFF_VERSION}/install.sh | version=${OASDIFF_VERSION} sh

      - name: breaking changes check
        run: |
          yarn backstage-repo-tools repo schema openapi diff --since "origin/$GITHUB_BASE_REF" > comment.md
          echo "<!-- api-breaking-changes-comment -->" >> comment.md

      - name: clone artifacts to current directory
        run: |
          cat "$GITHUB_EVENT_PATH" > event.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preview-spec
          path: |
            comment.md
            event.json
          retention-days: 2
          overwrite: true
