name: Deploy Microsite
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    concurrency:
      group: stable-reference-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192

    outputs:
      release: ${{ steps.find-release.outputs.result }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: find latest release ref
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: find-release
        with:
          script: |
            const versionValue = version =>
              version
                .split('.')
                .reduce((val, part) => val * 1000 + Number(part), 0)

            const tags = await octokit.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })

            const [latest] = tags
              .map(tag => tag.name)
              .filter(tag => tag.match(/^v\d+\.\d+\.\d+$/))
              .map(tag => ({ tag, val: versionValue(tag.slice(1)) }))
              .sort((a, b) => b.val - a.val)

            if (!latest) {
              throw new Error('Unable to find a main line release to build stable docs from')
            }

            // Each release line has a single patch branch, named after its first
            // release, that collects any patch releases made from it. We prefer
            // that branch over the release tag, as it allows the stable docs to be
            // edited after the release.
            const [major, minor] = latest.tag.slice(1).split('.')
            const branch = `patch/v${major}.${minor}.0`

            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch,
              })

              core.info(`Building stable docs from branch ${branch}`)
              return `refs/heads/${branch}`
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }
            }

            // The patch branch has not been created yet, which is the case in the
            // window right after a main line release. Use the release tag until it
            // shows up, rather than the previous release line.
            core.info(`Found no ${branch} branch, building stable docs from tag ${latest.tag}`)
            return `refs/tags/${latest.tag}`
          result-encoding: string

      - name: checkout latest release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.find-release.outputs.result }}

      - name: Use Node.js 22.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/ # Needed for auth

      - name: yarn install
        uses: backstage/actions/yarn-install@a9e1b58ad52aaf319264e18c3ff6887a4c824b52 # v0.7.13
        with:
          cache-prefix: ${{ runner.os }}-v22.x

      # Use the lower-level cache actions for the success cache, so that we can store the cache even on failed builds
      - name: restore package-docs cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/package-docs
          key: ${{ runner.os }}-v${{ matrix.node-version }}-package-docs-stable-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-v${{ matrix.node-version }}-package-docs-stable-

      - name: build API reference
        run: yarn backstage-repo-tools package-docs

      - name: upload API reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stable-reference
          path: type-docs/
          if-no-files-found: error
          retention-days: 1

      # Always save success cache even if there were failures, that way it can be used in re-triggered builds
      - name: save package-docs cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always()
        with:
          path: .cache/package-docs
          key: ${{ runner.os }}-v${{ matrix.node-version }}-package-docs-stable-${{ github.run_id }}

      - name: microsite yarn install
        run: yarn install --immutable
        working-directory: microsite

      - name: build OpenAPI API docs
        working-directory: microsite
        run: yarn docusaurus gen-api-docs all

      - name: upload OpenAPI API docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stable-openapi-docs
          path: docs/**/api/**/*
          if-no-files-found: error
          retention-days: 1

  next:
    runs-on: ubuntu-latest
    concurrency:
      group: next-reference-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/ # Needed for auth

      - name: yarn install
        uses: backstage/actions/yarn-install@a9e1b58ad52aaf319264e18c3ff6887a4c824b52 # v0.7.13
        with:
          cache-prefix: ${{ runner.os }}-v22.x

      # Use the lower-level cache actions for the success cache, so that we can store the cache even on failed builds
      - name: restore package-docs cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/package-docs
          key: ${{ runner.os }}-v${{ matrix.node-version }}-package-docs-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-v${{ matrix.node-version }}-package-docs-

      - name: build API reference
        run: yarn backstage-repo-tools package-docs

      - name: upload API reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: next-reference
          path: type-docs/
          if-no-files-found: error
          retention-days: 1

      # Always save success cache even if there were failures, that way it can be used in re-triggered builds
      - name: save package-docs cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always()
        with:
          path: .cache/package-docs
          key: ${{ runner.os }}-v${{ matrix.node-version }}-package-docs-${{ github.run_id }}

      - name: Build Storybook
        run: yarn build-storybook

      - name: Upload Storybook
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storybook
          path: dist-storybook
          if-no-files-found: error
          retention-days: 1

      - name: microsite yarn install
        run: yarn install --immutable
        working-directory: microsite

      - name: build OpenAPI API docs
        working-directory: microsite
        run: yarn docusaurus gen-api-docs all

      - name: upload OpenAPI API docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: next-openapi-docs
          path: docs/**/api/**/*
          if-no-files-found: error
          retention-days: 1

  deploy-microsite-and-storybook:
    permissions:
      contents: write # for JamesIves/github-pages-deploy-action to push changes in repo

    runs-on: ubuntu-latest

    needs:
      - stable
      - next

    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=16384
      DOCUSAURUS_SSR_CONCURRENCY: 5

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Use Node.js 22.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/ # Needed for auth

      # Stable docs
      - name: checkout latest release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.stable.outputs.release }}

      - name: microsite yarn install
        run: yarn install --immutable
        working-directory: microsite

      - name: download stable OpenAPI API docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stable-openapi-docs
          path: docs

      - name: grab latest releases docs
        run: |
          git fetch origin master --depth 1
          git checkout FETCH_HEAD -- docs/releases

      - name: create missing generated file
        run: |
          mkdir -p docs/reference
          cat > docs/reference/index.md <<EOF
          ---
          id: 'index'
          title: 'Package Index'
          description: 'Index of all Backstage Packages'
          ---

          Please use [the new API documentation](https://backstage.io/api/stable) for more information.

          EOF

      - name: generate stable docs
        run: yarn docusaurus docs:version stable
        working-directory: microsite

      - name: clear generated docs
        run: git clean -fdx docs/

      # Next docs
      - name: checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: microsite yarn install
        run: yarn install --immutable
        working-directory: microsite

      - name: download next OpenAPI API docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: next-openapi-docs
          path: docs

      - name: build microsite
        run: yarn build
        working-directory: microsite

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: storybook
          path: microsite/build/storybook

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stable-reference
          path: microsite/build/api/stable/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: next-reference
          path: microsite/build/api/next/

      - name: Check the build output
        run: ls microsite/build && ls microsite/build/storybook && ls microsite/build/api/stable && ls microsite/build/api/next

      - name: Deploy both microsite and storybook to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: microsite/build
