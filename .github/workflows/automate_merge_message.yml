name: Automate merge message
on:
  pull_request_target:
    branches: ['master']
    types: ['closed']

permissions:
  pull-requests: write
  actions: none
  checks: none
  contents: none
  deployments: none
  issues: none
  packages: none
  pages: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  message:
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    # prevent running towards forks, and only run on merged PRs
    if: github.repository == 'backstage/backstage' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: '${{ github.event.pull_request.merge_commit_sha }}'
          # Safe to allow: this job only runs after the PR has already been merged
          # into master, so the checked-out code is no longer untrusted fork content.
          allow-unsafe-pr-checkout: true

      - name: fetch head & base
        run: git fetch --depth 1 origin "$PR_HEAD_SHA" "$PR_BASE_SHA"

        # We avoid using the in-source script since this workflow has elevated permissions that we don't want to expose
      - name: Generate Message
        id: generate-message
        run: |
          rm -f generate.js
          wget -O generate.js https://raw.githubusercontent.com/backstage/backstage/master/scripts/generate-merge-message.js 1>&2
          node generate.js "$PR_BASE_SHA" "$PR_HEAD_SHA" > message.txt

      - name: Post Message
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const owner = "backstage";
            const repo = "backstage";
            const body = require('fs').readFileSync('message.txt', 'utf8').trim();
            const issue_number = Number(process.env.ISSUE_NUMBER);

            if (!body) {
              console.log(`skipping comment for #${issue_number}`);
              return;
            }

            console.log(`creating comment for #${issue_number}`);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
