name: Sync BUI Docs
on:
  push:
    branches: [master]

concurrency:
  group: sync-bui-docs
  cancel-in-progress: false

jobs:
  sync-docs-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org/ # Needed for auth

      - name: yarn install
        uses: backstage/actions/yarn-install@v0.7.13
        with:
          cache-prefix: ${{ runner.os }}-v24.x

      - name: Checkout backstage/docs-ui
        uses: actions/checkout@v7.0.1
        with:
          repository: backstage/docs-ui
          path: bui-external-docs
          token: ${{ secrets.GH_SERVICE_ACCOUNT_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email noreply@backstage.io
          git config --global user.name 'Github BUI Docs workflow'

      - name: Install dependencies
        working-directory: docs-ui
        run: yarn install

      - name: Build Docs UI
        working-directory: docs-ui
        run: |
          yarn build

      - name: Replace contents of bui-external-docs repo with docs build output
        working-directory: bui-external-docs
        run: |
          git rm -rf .
          cp -R ../docs-ui/dist/. .

      - name: Commit to bui-storybook repo
        working-directory: bui-external-docs
        run: |
          git add .
          git commit -am "BUI Docs build for backstage/backstage@$GITHUB_SHA"
          git push
