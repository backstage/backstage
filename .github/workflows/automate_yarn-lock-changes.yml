name: Yarn Lock Changes
on:
  pull_request_target:
    paths:
      - 'yarn.lock'

jobs:
  yarn-lock-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the commit that's merged into the base rather than the target ref.
          ref: 'refs/pull/${{ github.event.pull_request.number }}/merge'
          persist-credentials: false
          # Safe to allow: contents is read-only and the checkout is only ever
          # diffed for yarn.lock changes, never built or executed.
          allow-unsafe-pr-checkout: true

      - name: Yarn Lock Changes
        uses: Simek/yarn-lock-changes@59f47ee499424d2c2437c5aebf863b5c6d50a5bc # v0.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
