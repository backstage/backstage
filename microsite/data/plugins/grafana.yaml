        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          properties:
            grafana:
              type: object
              properties:
                domain:
                  type: string
                  description: 'Domain used by users to access Grafana web UI. Example: https://monitoring.eu.my-company.com/ Either `domain` or `hosts` must be defined.'
                  deprecated: Use `grafana.hosts[].domain` in `grafana.hosts` instead.
                  visibility: frontend
                proxyPath:
                  type: string
                  description: Path to use for requests via the proxy, defaults to /grafana/api
                  deprecated: Use `grafana.hosts[].proxyPath` in `grafana.hosts` instead.
                  visibility: frontend
                unifiedAlerting:
                  type: boolean
                  description: Is Grafana using unified alerting?
                  deprecated: Use `grafana.hosts[].unifiedAlerting` in `grafana.hosts` instead.
                  visibility: frontend
                grafanaDashboardSearchLimit:
                  type: number
                  description: Limit value to pass in Grafana Dashboard search query.
                  deprecated: Use server-side filtering instead. See https://github.com/backstage/community-plugins/pull/3909
                  visibility: frontend
                grafanaDashboardMaxPages:
                  type: number
                  description: Max pages of Grafana Dashboard search query to fetch.
                  deprecated: Use server-side filtering instead. See https://github.com/backstage/community-plugins/pull/3909
                  visibility: frontend
                defaultHost:
                  type: string
                  description: Default host id for entities that do not have the `grafana/host-id` annotation. Must match one of the `id` values in `grafana.hosts`. When not set, the first host in `hosts` is used (or the legacy `default` host).
                  visibility: frontend
                hosts:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier for this Grafana instance. Used in the `grafana/host-id` entity annotation.
                        visibility: frontend
                      domain:
                        type: string
                        description: 'Domain used by users to access this Grafana instance. Example: https://monitoring.eu.my-company.com/'
                        visibility: frontend
                      proxyPath:
                        type: string
                        description: Path to use for requests via the proxy for this instance. Defaults to /grafana/api
                        visibility: frontend
                      unifiedAlerting:
                        type: boolean
                        description: Is this Grafana instance using unified alerting?
                        visibility: frontend
                    required:
                      - id
                      - domain
                  description: List of Grafana instances to connect to. Either `domain` or `hosts` must be defined.
                  visibility: frontend
          required:
            - grafana
