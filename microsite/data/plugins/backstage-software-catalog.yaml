          - '@backstage/plugin-permission-common'
      configSchema:
        status: fresh
        lastAttemptAt: '2026-08-04T22:12:47.098Z'
        checkedAt: '2026-08-04T22:12:47.098Z'
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          properties:
            catalog:
              type: object
              properties:
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      allow:
                        type: array
                        items:
                          anyOf:
                            - type: string
                            - type: object
                              properties:
                                kind:
                                  type: string
                                spec.type:
                                  type: string
                              required:
                                - kind
                        description: |-
                          Allow entities of these particular kinds.

                          E.g. ["Component", "API", "Template", "Location"]

                          You can also specify the type of the entity by using an object with `kind` and optional `spec.type` properties. E.g. [{ kind: "Component", 'spec.type': "service" }]
                      locations:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: The type of location, e.g. "url".
                            exact:
                              type: string
                              description: |-
                                The exact location, e.g. "https://github.com/org/repo/blob/master/users.yaml".

                                The exact location can also be used to match on locations that contain glob characters themselves, e.g. "https://github.com/org/*\/blob/master/*.yaml".
                            pattern:
                              type: string
                              description: The pattern allowed for the location, e.g. "https://github.com/org/*\/blob/master/*.yaml".
                          required:
                            - type
                        description: |-
                          Limit this rule to a specific location

                          Example with a fixed location  { "type": "url", "exact": "https://github.com/a/b/blob/file.yaml"}

                          Example using a Regex  { "type": "url", "pattern": "https://github.com/org/*\/blob/master/*.yaml"}

                          Using both exact and pattern will result in an error starting the application
                    required:
                      - allow
                  description: |-
                    Rules to apply to all catalog entities, from any location.

                    An undefined list of matchers means match all, an empty list of matchers means match none.

                    This is commonly used to put in what amounts to an allowlist of kinds that regular users of Backstage are permitted to register locations for. This can be used to stop them from registering yaml files describing for example a Group entity called "admin" that they make themselves members of, or similar.
                readonly:
                  type: boolean
                  description: |-
                    Readonly defines whether the catalog allows writes after startup.

                    Setting 'readonly=false' allows users to register their own components. This is the default value.

                    Setting 'readonly=true' configures catalog to only allow reads. This can be used in combination with static locations to only serve operator provided locations. Effectively this removes the ability to register new components to a running backstage instance.
                locations:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: The type of location, e.g. "url".
                      target:
                        type: string
                        description: The target URL of the location, e.g. "https://github.com/org/repo/blob/master/users.yaml".
                      rules:
                        type: array
                        items:
                          type: object
                          properties:
                            allow:
                              type: array
                              items:
                                type: string
                              description: |-
                                Allow entities of these particular kinds.

                                E.g. ["Group", "User"]
                          required:
                            - allow
                        description: |-
                          Optional extra rules that apply to this particular location.

                          These override the global rules above.
                    required:
                      - type
                      - target
                  description: |-
                    A set of static locations that the catalog shall always keep itself up-to-date with. This is commonly used for large, permanent integrations that are defined by the Backstage operators at an organization, rather than individual things that users register dynamically.

                    These have (optional) rules of their own. These override what the global rules above specify. This way, you can prevent everybody from register e.g. User and Group entities, except for one or a few static locations that have those two kinds explicitly allowed.

                    For example:

                    ```yaml rules:   - allow: [Component, API, Template, Location] locations:   - type: url     target: https://github.com/org/repo/blob/master/users.yaml     rules:       - allow: [User, Group]   - type: url     target: https://github.com/org/repo/blob/master/systems.yaml     rules:       - allow: [System] ```
                enableRelationsCompatibility:
                  type: boolean
                  description: |-
                    Enables the compatibility layer for relations in returned entities that ensures that all relations objects have both `target` and `targetRef`.

                    Enabling this option significantly increases the memory usage of the catalog, and slightly reduces performance, but may avoid breaking consumers that rely on the existence of `target` in the relations objects.
                disableDefaultProcessors:
                  type: boolean
                  description: |-
                    Disables the default backstage processors.

                    Enabling this option allows more complete control of which processors are included in the backstage processing loop.
                orphanStrategy:
                  type: string
                  enum:
                    - keep
                    - delete
                  description: The strategy to use for entities that are orphaned, i.e. no longer have any other entities or providers referencing them. The default value is "delete".
                orphanProviderStrategy:
                  type: string
                  enum:
                    - keep
                    - delete
                  description: The strategy to use for entities that are referenced by providers that are orphaned, i.e. entities with no providers currently configured in the catalog. The default value is "delete".
                stitchingStrategy:
                  type: object
                  properties:
                    mode:
                      type: string
                      deprecated: Immediate mode has been removed. This field is ignored.
                    pollingInterval:
                      anyOf:
                        - type: object
                          properties:
                            years:
                              type: number
                            months:
                              type: number
                            weeks:
                              type: number
                            days:
                              type: number
                            hours:
                              type: number
                            minutes:
                              type: number
                            seconds:
                              type: number
                            milliseconds:
                              type: number
                          description: Human friendly durations object.
                        - type: string
                      description: Polling interval for tasks in seconds
                    stitchTimeout:
                      anyOf:
                        - type: object
                          properties:
                            years:
                              type: number
                            months:
                              type: number
                            weeks:
                              type: number
                            days:
                              type: number
                            hours:
                              type: number
                            minutes:
                              type: number
                            seconds:
                              type: number
                            milliseconds:
                              type: number
                          description: Human friendly durations object.
                        - type: string
                      description: How long to wait for a stitch to complete before giving up in seconds
                  description: The strategy to use when stitching together the final entities.
                defaultLocationConflictStrategy:
                  type: string
                  enum:
                    - refresh
                    - reject
                  description: |-
                    The strategy to use when there is a conflict with a location being registered.

                    The default value is "reject".

                    The "refresh" strategy will refresh the existing location instead of throwing a conflict error.
                processingInterval:
                  anyOf:
                    - type: object
                      properties:
                        years:
                          type: number
                        months:
                          type: number
                        weeks:
                          type: number
                        days:
                          type: number
                        hours:
                          type: number
                        minutes:
                          type: number
                        seconds:
                          type: number
                        milliseconds:
                          type: number
                      description: Human friendly durations object.
                    - type: boolean
                      const: false
                  description: The interval at which the catalog should process its entities.
                providerOptions:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      disabled:
                        type: boolean
                        description: Determines whether this provider is disabled or not. If not specified, defaults to false.
                    description: Key is the provider name, value is an object with additional configuration
                  description: Provider-specific additional configuration options.
                processorOptions:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      disabled:
                        type: boolean
                        description: Determines whether this processor is disabled or not. If not specified, defaults to false.
                      priority:
                        type: number
                        description: The default priority is 20, and lower value means that the processor runs earlier.
                    description: Key is the processor name, value is an object with additional configuration
                  description: Processor-specific additional configuration options.
                scmEvents:
