name: blitzy-sandbox-backstage
services:
  # Single entry point on :8080 with /toggle page to switch design systems
  # Use with ngrok: ngrok http 8080
  #
  # Prerequisites: start the apps on the host first:
  #   yarn start example-backend &
  #   yarn start example-app &
  #   PORT=3001 yarn start example-app-legacy --config ../../app-config.yaml &
  #   docker compose up
  proxy:
    image: nginx:alpine
    ports:
      - '8080:8080'
    volumes:
      - ./nginx-toggle.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
