site_name: 'Backstage'
site_description: 'Main documentation for Backstage features and framework APIs'
repo_url: https://github.com/backstage/backstage
edit_uri: edit/master/docs

# Restrict CI validation to the overview docs only.
docs_dir: docs/overview

plugins:
  - techdocs-core


# Minimal MkDocs configuration used by CI to validate core overview pages
# without building the complete documentation site defined in mkdocs.yml.
nav:
  - Overview:
      - What is Backstage?: 'what-is-backstage.md'
      - Technical overview: 'technical-overview.md'
      - Architecture overview: 'architecture-overview.md'
      - Project Roadmap: 'roadmap.md'
      - Vision: 'vision.md'
      - The Spotify Story: 'background.md'
      - Strategies for adopting: 'adopting.md'
      - Release & Versioning Policy: 'versioning-policy.md'
      - Backstage Threat Model: 'threat-model.md'
      - Support and community: 'support.md'
      - Logo assets: 'logos.md'
